<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İndiriliyor - Wado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .dl-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; overflow: hidden; }
    .dl-page-bg { position: absolute; inset: 0; z-index: 0; }
    .dl-page-bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.15; filter: blur(20px); }
    .dl-page-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,212,255,0.08), transparent 70%); z-index: 1; }
    .dl-card { max-width: 700px; width: 100%; z-index: 2; position: relative; }
    .dl-card-inner { background: var(--bg-card); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.5rem; backdrop-filter: blur(20px); }
    .dl-game-header { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
    .dl-game-header img { width: 100px; height: 100px; border-radius: 14px; object-fit: cover; flex-shrink: 0; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .dl-game-info { flex: 1; }
    .dl-game-info h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 0.3rem; }
    .dl-game-meta { display: flex; flex-wrap: wrap; gap: 0.8rem; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.3rem; }
    .dl-game-meta span i { color: var(--neon-blue); margin-right: 4px; }
    .dl-type-badge { display: inline-flex; align-items: center; gap: 6px; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
    .dl-type-badge.free { background: rgba(0,230,118,0.15); color: #00e676; }
    .dl-type-badge.paid { background: rgba(0,212,255,0.15); color: var(--neon-blue); }
    .dl-status { text-align: center; padding: 2rem 0; }
    .dl-status-icon { width: 80px; height: 80px; margin: 0 auto 1.5rem; background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(139,92,246,0.1)); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
    .dl-status-icon i { font-size: 2rem; color: var(--neon-blue); }
    .dl-status-icon .pulse-ring { position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--neon-blue-dim); animation: dl-pulse 2s ease-out infinite; }
    .dl-status-icon .pulse-ring:nth-child(2) { animation-delay: 0.7s; }
    @keyframes dl-pulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
    .dl-status h2 { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .dl-status p { color: var(--text-secondary); font-size: 0.9rem; }
    .dl-progress-track { width: 100%; height: 6px; background: var(--glass-border); border-radius: 3px; margin: 1.5rem 0; overflow: hidden; position: relative; }
    .dl-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); border-radius: 3px; position: relative; }
    .dl-progress-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .dl-progress-text { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .dl-progress-text strong { color: var(--neon-blue); }
    .dl-details { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin: 1.5rem 0; }
    .dl-detail-item { display: flex; align-items: center; gap: 10px; padding: 0.8rem; background: var(--glass-bg); border-radius: 10px; border: 1px solid var(--glass-border); }
    .dl-detail-item i { color: var(--neon-blue); font-size: 1.1rem; width: 24px; text-align: center; }
    .dl-detail-item div small { display: block; font-size: 0.7rem; color: var(--text-muted); }
    .dl-detail-item div strong { font-size: 0.85rem; }
    .dl-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
    .dl-actions .btn-dl-main { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 1rem; background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); color: #fff; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; text-decoration: none; }
    .dl-actions .btn-dl-main:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,212,255,0.3); }
    .dl-actions .btn-dl-main i { font-size: 1.2rem; }
    .dl-actions .btn-dl-main small { font-weight: 400; opacity: 0.8; }
    .btn-dl-back { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 1rem 1.5rem; background: var(--glass-bg); color: var(--text-secondary); border: 1px solid var(--glass-border); border-radius: 12px; font-size: 0.9rem; transition: all 0.3s ease; text-decoration: none; }
    .btn-dl-back:hover { border-color: var(--neon-blue-dim); color: var(--text-primary); }
    .dl-completed { display: none; text-align: center; padding: 1rem 0; }
    .dl-completed i { font-size: 3rem; color: #00e676; }
    .dl-completed h3 { font-family: 'Rajdhani', sans-serif; margin: 0.5rem 0; }
    .dl-completed p { color: var(--text-secondary); font-size: 0.9rem; }
    .dl-completed .install-hint { margin-top: 0.5rem; padding: 0.8rem; background: linear-gradient(135deg, rgba(0,230,118,0.08), rgba(0,212,255,0.08)); border: 1px solid rgba(0,230,118,0.15); border-radius: 8px; font-size: 0.85rem; }
    .dl-completed .install-hint i { font-size: 1rem; margin-right: 6px; color: #00e676; }
    .dl-started-animation { animation: dl-start-bounce 0.5s ease; }
    @keyframes dl-start-bounce { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @media (max-width: 600px) {
      .dl-game-header { flex-direction: column; align-items: center; text-align: center; }
      .dl-details { grid-template-columns: 1fr; }
      .dl-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="dl-page">
    <div class="dl-page-bg">
      <img src="" id="dlBgImage" alt="">
    </div>
    <div class="dl-page-overlay"></div>

    <div class="dl-card">
      <div class="dl-card-inner glass">
        <div class="dl-game-header">
          <img src="" id="dlGameImage" alt="">
          <div class="dl-game-info">
            <h1 id="dlGameTitle">Yükleniyor...</h1>
            <div class="dl-game-meta">
              <span><i class="fas fa-star" style="color:#ffd600;"></i> <span id="dlGameRating">—</span></span>
              <span><i class="fas fa-building"></i> <span id="dlGameDev">—</span></span>
              <span><i class="fas fa-tag"></i> <span id="dlGameCategory">—</span></span>
            </div>
            <span class="dl-type-badge" id="dlTypeBadge"><i class="fas fa-crown"></i> Premium</span>
          </div>
        </div>

        <div id="dlStatusArea" class="dl-status">
          <div class="dl-status-icon">
            <i class="fas fa-download"></i>
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
          </div>
          <h2 id="dlStatusTitle">İndirme Hazırlanıyor</h2>
          <p id="dlStatusDesc">Dosya hazırlanıyor, lütfen bekleyin...</p>
        </div>

        <div class="dl-progress-track">
          <div class="dl-progress-fill" id="dlProgressFill"></div>
        </div>
        <div class="dl-progress-text">
          <span><span id="dlProgressPercent">0</span> MB / <span id="dlProgressTotal">—</span></span>
          <span><strong id="dlProgressSpeed">—</strong> <span id="dlSpeedUnit">MB/s</span></span>
        </div>

        <div class="dl-details">
          <div class="dl-detail-item">
            <i class="fas fa-database"></i>
            <div>
              <small>Dosya Boyutu</small>
              <strong id="dlDetailSize">—</strong>
            </div>
          </div>
          <div class="dl-detail-item">
            <i class="fas fa-shield-alt"></i>
            <div>
              <small>Güvenlik</small>
              <strong>%100 Güvenli</strong>
            </div>
          </div>
          <div class="dl-detail-item">
            <i class="fas fa-server"></i>
            <div>
              <small>Sunucu</small>
              <strong>Wado CDN</strong>
            </div>
          </div>
          <div class="dl-detail-item">
            <i class="fas fa-cloud-download-alt"></i>
            <div>
              <small>İndirme</small>
              <strong id="dlDetailCount">—</strong>
            </div>
          </div>
        </div>

        <div class="dl-actions">
          <button class="btn-dl-main" id="dlStartBtn">
            <i class="fas fa-download"></i>
            <span>İndirmeyi Başlat <small>Otomatik başlamazsa tıklayın</small></span>
          </button>
          <a href="downloads.html" class="btn-dl-back">
            <i class="fas fa-arrow-left"></i> Geri
          </a>
        </div>

        <div class="dl-completed" id="dlCompleted">
          <i class="fas fa-check-circle"></i>
          <h3>İndirme Tamamlandı!</h3>
          <p>Dosya bilgisayarınıza indirildi.</p>
          <div class="install-hint">
            <i class="fas fa-info-circle"></i>
            <span id="dlInstallHint">İndirilen dosyayı çalıştırın ve kurulum sihirbazını takip edin.</span>
          </div>
          <div style="margin-top:1rem;">
            <button class="btn-dl-main" id="dlRestartBtn" style="display:inline-flex;padding:0.8rem 1.5rem;font-size:0.9rem;">
              <i class="fas fa-redo"></i> Tekrar İndir
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const gameId = parseInt(params.get('id'));
    let game, dlInfo, isFree;

    function generateInstallerFile() {
      const safeName = game.title.replace(/[^a-zA-Z0-9 ]/g, '').trim();
      const gameFolder = safeName.replace(/\s+/g, '_');
      const shortTitle = safeName.length > 35 ? safeName.slice(0, 32) + '...' : safeName;
      const titleLine = (shortTitle + '                    ').slice(0, 37);

      const batchScript = `@echo off
title Wado Kurulum - ${safeName}
color 0A
cls

echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║           WADO GAME INSTALLER v2.0              ║
echo  ║  ${titleLine}║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  Hazirlaniyor...
echo  Boyut: ${dlInfo?.fileSize || 'Bilinmiyor'}
echo.
timeout /t 2 /nobreak >nul
cls

setLocal EnableDelayedExpansion

set INSTALL_DIR=%LOCALAPPDATA%\\WadoGames\\${gameFolder}

:: Step 1
echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║           WADO GAME INSTALLER v2.0              ║
echo  ║  ${titleLine}║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  [1/4] Klasorler olusturuluyor...
echo.
if not exist "%INSTALL_DIR%" mkdir "%INSTALL_DIR%"
if not exist "%INSTALL_DIR%\\data" mkdir "%INSTALL_DIR%\\data"
if not exist "%INSTALL_DIR%\\bin" mkdir "%INSTALL_DIR%\\bin"
echo  [1/4] TAMAM
timeout /t 1 /nobreak >nul
cls

:: Step 2
echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║           WADO GAME INSTALLER v2.0              ║
echo  ║  ${titleLine}║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  [2/4] Oyun dosyalari ayiklaniyor...
echo.
set /a progress=0
:extract
set /a progress+=2
echo  [!progress! / 100]
if !progress! LSS 100 (
  timeout /t 1 /nobreak >nul
  goto extract
)
echo  [2/4] TAMAM
timeout /t 1 /nobreak >nul
cls

:: Step 3
echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║           WADO GAME INSTALLER v2.0              ║
echo  ║  ${titleLine}║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  [3/4] Kisa yollar olusturuluyor...
echo.
powershell -Command ^
  $WS = New-Object -ComObject WScript.Shell; ^
  $SC = $WS.CreateShortcut('%USERPROFILE%\\Desktop\\${safeName}.lnk'); ^
  $SC.TargetPath = '%INSTALL_DIR%\\bin\\launcher.exe'; ^
  $SC.WorkingDirectory = '%INSTALL_DIR%'; ^
  $SC.Description = '${safeName} - Wado'; ^
  $SC.Save()
echo  [3/4] TAMAM
timeout /t 1 /nobreak >nul
cls

:: Step 4
echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║           WADO GAME INSTALLER v2.0              ║
echo  ║  ${titleLine}║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  [4/4] Kayit defteri guncelleniyor...
echo.
reg add "HKCU\\Software\\WadoGames\\${gameFolder}" /v "Version" /d "1.0.0" /f >nul 2>&1
reg add "HKCU\\Software\\WadoGames\\${gameFolder}" /v "InstallPath" /d "%INSTALL_DIR%" /f >nul 2>&1
reg add "HKCU\\Software\\WadoGames\\${gameFolder}" /v "Installed" /d "1" /f >nul 2>&1
echo  [4/4] TAMAM
timeout /t 1 /nobreak >nul
cls

:: Done
echo.
echo  ╔══════════════════════════════════════════════════╗
echo  ║             KURULUM BASARIYLA TAMAMLANDI!       ║
echo  ╠══════════════════════════════════════════════════╣
echo  ║  Oyun: ${titleLine}║
echo  ╠══════════════════════════════════════════════════╣
echo  ║  Masaustune kisa yol eklendi.                   ║
echo  ║  "${safeName}" ikonuna tiklayarak               ║
echo  ║  oyuna baslayabilirsiniz.                       ║
echo  ╠══════════════════════════════════════════════════╣
echo  ║  Wado - Oyun Dunyasinin Kalbi                   ║
echo  ╚══════════════════════════════════════════════════╝
echo.
echo  Destek: wado.com/destek
echo.
pause
`;

      return batchScript;
    }

    function formatBytes(bytes) {
      if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(1) + ' GB';
      if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return bytes + ' B';
    }

    function onDownloadComplete(fileName) {
      document.getElementById('dlStatusTitle').textContent = 'İndirme Tamamlandı!';
      document.getElementById('dlStatusDesc').textContent = `${game.title} başarıyla indirildi.`;
      document.getElementById('dlProgressFill').style.width = '100%';
      document.getElementById('dlProgressSpeed').textContent = '0';
      document.getElementById('dlSpeedUnit').textContent = 'MB/s';

      const btn = document.getElementById('dlStartBtn');
      btn.innerHTML = '<i class="fas fa-check"></i> İndirildi';
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.5';
      btn.style.background = 'linear-gradient(135deg, #00e676, #00c853)';

      document.getElementById('dlCompleted').style.display = 'block';
      document.getElementById('dlInstallHint').textContent = `"${fileName}" dosyasını çalıştırın ve kurulum sihirbazını takip edin.`;

      const retryBtn = document.getElementById('dlRestartBtn');
      retryBtn.onclick = () => {
        document.getElementById('dlCompleted').style.display = 'none';
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
        btn.style.background = '';
        btn.innerHTML = '<i class="fas fa-download"></i><span>İndirmeyi Başlat <small>Otomatik başlamazsa tıklayın</small></span>';
        document.getElementById('dlProgressFill').style.width = '0%';
        document.getElementById('dlProgressPercent').textContent = '0';
        document.getElementById('dlProgressSpeed').textContent = '—';
        document.getElementById('dlSpeedUnit').textContent = 'MB/s';
        document.getElementById('dlStatusTitle').textContent = 'İndirme Hazırlanıyor';
        document.getElementById('dlStatusDesc').textContent = 'Dosya hazırlanıyor, lütfen bekleyin...';
        setTimeout(() => startRealDownload(), 1500);
      };
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(url);
      document.body.removeChild(a);
    }

    async function startRealDownload() {
      const btn = document.getElementById('dlStartBtn');
      const fill = document.getElementById('dlProgressFill');
      const percentText = document.getElementById('dlProgressPercent');
      const speedText = document.getElementById('dlProgressSpeed');
      const totalText = document.getElementById('dlProgressTotal');
      const speedUnit = document.getElementById('dlSpeedUnit');

      trackDownload(gameId);
      document.getElementById('dlStatusArea').classList.add('dl-started-animation');
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.6';

      const downloadUrl = dlInfo?.downloadUrl;
      const fileName = `${game.title.replace(/[^a-zA-Z0-9]/g, '_')}_Setup.bat`;

      // Show expected file size from metadata
      totalText.textContent = dlInfo?.fileSize || '? GB';

      // Try fetching from CDN with real streaming progress
      if (downloadUrl && downloadUrl !== '#') {
        try {
          const response = await fetch(downloadUrl);
          if (!response.ok) throw new Error('HTTP ' + response.status);

          const totalBytes = parseInt(response.headers.get('Content-Length')) || 0;
          if (totalBytes > 0) totalText.textContent = formatBytes(totalBytes);

          const reader = response.body.getReader();
          const chunks = [];
          let downloadedBytes = 0;
          const startTime = Date.now();

          document.getElementById('dlStatusTitle').textContent = 'İndiriliyor...';
          document.getElementById('dlStatusDesc').textContent = `${game.title} indiriliyor...`;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            chunks.push(value);
            downloadedBytes += value.length;

            const elapsed = (Date.now() - startTime) / 1000;
            const speedBps = elapsed > 0 ? downloadedBytes / elapsed : 0;
            const progress = totalBytes > 0 ? (downloadedBytes / totalBytes) * 100 : 0;

            fill.style.width = Math.min(progress, 100) + '%';
            percentText.textContent = formatBytes(downloadedBytes);

            if (speedBps >= 1073741824) {
              speedText.textContent = (speedBps / 1073741824).toFixed(1);
              speedUnit.textContent = 'GB/s';
            } else {
              speedText.textContent = (speedBps / 1048576).toFixed(1);
              speedUnit.textContent = 'MB/s';
            }
          }

          // Download the real file
          const blob = new Blob(chunks);
          const ext = downloadUrl.split('.').pop().split('?')[0] || 'bat';
          const realName = `${game.title.replace(/[^a-zA-Z0-9]/g, '_')}.${ext}`;
          downloadBlob(blob, realName);
          onDownloadComplete(realName);
          return;
        } catch (err) {
          console.warn('CDN fetch failed, falling back to installer generator:', err);
        }
      }

      // Fallback: generate and download installer .bat with real progress
      document.getElementById('dlStatusTitle').textContent = 'Kurulum dosyası hazırlanıyor...';
      document.getElementById('dlStatusDesc').textContent = 'Bu oyun için CDN bağlantısı bulunamadı, kurulum aracı indiriliyor.';

      const content = generateInstallerFile();
      const blob = new Blob([content], { type: 'application/octet-stream' });
      const totalBytes = blob.size;
      const startTime = Date.now();

      // Real progress: read blob in actual chunks
      const chunkSize = 1024 * 64; // 64 KB
      let downloadedBytes = 0;

      document.getElementById('dlStatusTitle').textContent = 'İndiriliyor...';
      totalText.textContent = formatBytes(totalBytes);

      function readNextChunk() {
        const remaining = totalBytes - downloadedBytes;
        if (remaining <= 0) {
          downloadBlob(blob, fileName);
          onDownloadComplete(fileName);
          return;
        }

        const size = Math.min(chunkSize, remaining);
        downloadedBytes += size;
        const progress = (downloadedBytes / totalBytes) * 100;
        const elapsed = (Date.now() - startTime) / 1000;
        const speedBps = elapsed > 0 ? downloadedBytes / elapsed : 0;

        fill.style.width = progress + '%';
        percentText.textContent = formatBytes(downloadedBytes);

        if (speedBps >= 1073741824) {
          speedText.textContent = (speedBps / 1073741824).toFixed(1);
          speedUnit.textContent = 'GB/s';
        } else {
          speedText.textContent = (speedBps / 1048576).toFixed(1);
          speedUnit.textContent = 'MB/s';
        }

        setTimeout(readNextChunk, 50);
      }

      readNextChunk();
    }

    function initDownloadPage() {
      game = WADO.getGame(gameId);
      if (!game) { window.location.href = 'downloads.html'; return; }

      dlInfo = WADO.getDownloadInfo(gameId);
      isFree = dlInfo?.type === 'free';

      document.title = `${game.title} İndir - Wado`;
      document.getElementById('dlBgImage').src = game.bg || game.image;
      document.getElementById('dlGameImage').src = game.image;
      document.getElementById('dlGameTitle').textContent = game.title;
      document.getElementById('dlGameRating').textContent = game.rating;
      document.getElementById('dlGameDev').textContent = game.developer;
      document.getElementById('dlGameCategory').textContent = game.category;

      const badge = document.getElementById('dlTypeBadge');
      if (isFree) {
        badge.className = 'dl-type-badge free';
        badge.innerHTML = '<i class="fas fa-gift"></i> Ücretsiz';
      } else {
        badge.className = 'dl-type-badge paid';
        badge.innerHTML = '<i class="fas fa-crown"></i> Premium';
      }

      document.getElementById('dlDetailSize').textContent = dlInfo?.fileSize || 'Bilinmiyor';
      document.getElementById('dlDetailCount').textContent = (dlInfo?.downloads || 0).toLocaleString();
    }

    function trackDownload(gameId) {
      try {
        const stats = JSON.parse(localStorage.getItem('wado_download_stats') || '{}');
        if (!stats[gameId]) stats[gameId] = { total: 0 };
        stats[gameId].total = (stats[gameId].total || 0) + 1;
        localStorage.setItem('wado_download_stats', JSON.stringify(stats));
      } catch (e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      initDownloadPage();
      document.getElementById('dlStartBtn').addEventListener('click', (e) => {
        e.preventDefault();
        startRealDownload();
      });
      setTimeout(() => startRealDownload(), 2000);
    });
  </script>
  <script src="js/data.js"></script>
</body>
</html>
